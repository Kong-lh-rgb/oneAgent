id: learning-02
group: learning
name: 相似 Python debug 任务 → CREATE candidate
user_input: "learning pipeline"
initial_tasks:
  - alias: d1
    title: 修复 Python ImportError
    goal: 恢复项目启动
    status: completed
    run_ids: [r1]
    steps:
      - {id: s1, title: 复现错误, status: done, note: 已复现}
      - {id: s2, title: 读 traceback, status: done, note: 定位根因}
      - {id: s3, title: 修复并跑 pytest, status: done, note: 已验证}
  - alias: d2
    title: 修复 Python TypeError
    goal: 恢复启动
    status: completed
    run_ids: [r2]
    steps:
      - {id: s1, title: 复现错误, status: done, note: 已复现}
      - {id: s2, title: 读 traceback, status: done, note: 定位根因}
      - {id: s3, title: 修复并跑 pytest, status: done, note: 已验证}
  - alias: d3
    title: 修复 Python KeyError
    goal: 恢复正常运行
    status: completed
    run_ids: [r3]
    steps:
      - {id: s1, title: 复现错误, status: done, note: 已复现}
      - {id: s2, title: 读 traceback, status: done, note: 定位根因}
      - {id: s3, title: 修复并跑 pytest, status: done, note: 已验证}
  - alias: d4
    title: 修复 Python AttributeError
    goal: 恢复运行
    status: completed
    run_ids: [r4]
    steps:
      - {id: s1, title: 复现错误, status: done, note: 已复现}
      - {id: s2, title: 读 traceback, status: done, note: 定位根因}
      - {id: s3, title: 修复并跑 pytest, status: done, note: 已验证}
initial_runs:
  - run_id: r1
    events:
      - {type: tool_started, tool_name: read_file, arguments: {path: main.py}}
      - {type: tool_completed, tool_name: read_file, arguments: {path: main.py}}
      - {type: tool_started, tool_name: run_pytest, arguments: {}}
      - {type: tool_completed, tool_name: run_pytest, arguments: {}, success: false, error: ImportError}
      - {type: tool_started, tool_name: task_update, arguments: {goal: 恢复启动}}
      - {type: tool_completed, tool_name: task_update, arguments: {goal: 恢复启动}}
      - {type: agent_completed}
  - run_id: r2
    events:
      - {type: tool_started, tool_name: read_file, arguments: {path: app.py}}
      - {type: tool_completed, tool_name: read_file, arguments: {path: app.py}}
      - {type: tool_started, tool_name: run_pytest, arguments: {}}
      - {type: tool_completed, tool_name: run_pytest, arguments: {}, success: false, error: TypeError}
      - {type: tool_started, tool_name: task_update, arguments: {status: completed}}
      - {type: tool_completed, tool_name: task_update, arguments: {status: completed}}
      - {type: agent_completed}
  - run_id: r3
    events:
      - {type: tool_started, tool_name: read_file, arguments: {path: models.py}}
      - {type: tool_completed, tool_name: read_file, arguments: {path: models.py}}
      - {type: tool_started, tool_name: run_pytest, arguments: {}}
      - {type: tool_completed, tool_name: run_pytest, arguments: {}, success: false, error: KeyError}
      - {type: tool_started, tool_name: task_update, arguments: {status: completed}}
      - {type: tool_completed, tool_name: task_update, arguments: {status: completed}}
      - {type: agent_completed}
  - run_id: r4
    events:
      - {type: tool_started, tool_name: read_file, arguments: {path: utils.py}}
      - {type: tool_completed, tool_name: read_file, arguments: {path: utils.py}}
      - {type: tool_started, tool_name: run_pytest, arguments: {}}
      - {type: tool_completed, tool_name: run_pytest, arguments: {}, success: false, error: AttributeError}
      - {type: tool_started, tool_name: task_update, arguments: {status: completed}}
      - {type: tool_completed, tool_name: task_update, arguments: {status: completed}}
      - {type: agent_completed}
expect:
  learning:
    batch_size: 4
    candidate_count: 1
    create_count: 1
    update_count: 0
    expected_action: create
    expected_names: [python-runtime-debug]
    expected_pattern_task_aliases: [d1, d2, d3, d4]
