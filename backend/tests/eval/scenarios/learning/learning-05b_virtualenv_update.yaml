id: learning-05b
group: learning
name: 强证据证明 virtualenv 是稳定新增步骤 → UPDATE debug-python
user_input: "learning pipeline"
initial_skills:
  - name: debug-python
    # 中性描述 + 正文都不含 virtualenv 检查：必须靠任务的强证据证明
    # "确认 virtualenv"是稳定新增步骤（与 learning-05c 的"正文已含"形成对照）。
    description: 排查 Python 报错或异常的标准流程
    body: |
      # Debug Python
      1. 复现
      2. 读 traceback
      3. 修复并验证
initial_tasks:
  - alias: v1
    title: 排查 Python 虚拟环境报错
    goal: 恢复运行
    status: completed
    run_ids: [r1, r2]
    steps:
      - {id: s1, title: 复现错误, status: done, note: 已复现}
      - {id: s2, title: 确认 virtualenv, status: done, note: 每次修复前先确认 virtualenv 是关键步骤}
      - {id: s3, title: 修复并验证, status: done, note: pytest 通过}
  - alias: v2
    title: 排查 Python 依赖报错
    goal: 恢复运行
    status: completed
    run_ids: [r3, r4]
    steps:
      - {id: s1, title: 复现错误, status: done, note: 已复现}
      - {id: s2, title: 确认 virtualenv, status: done, note: 每次修复前先确认 virtualenv 是关键步骤}
      - {id: s3, title: 修复并验证, status: done, note: pytest 通过}
  - alias: v3
    title: 排查 Python 路径报错
    goal: 恢复启动
    status: completed
    run_ids: [r5, r6]
    steps:
      - {id: s1, title: 复现错误, status: done, note: 已复现}
      - {id: s2, title: 确认 virtualenv, status: done, note: 每次修复前先确认 virtualenv 是关键步骤}
      - {id: s3, title: 修复并验证, status: done, note: pytest 通过}
  - alias: v4
    title: 排查 Python 环境报错
    goal: 恢复运行
    status: completed
    run_ids: [r7, r8]
    steps:
      - {id: s1, title: 复现错误, status: done, note: 已复现}
      - {id: s2, title: 确认 virtualenv, status: done, note: 每次修复前先确认 virtualenv 是关键步骤}
      - {id: s3, title: 修复并验证, status: done, note: pytest 通过}
# 强证据：每个 task 有 2 个 run —— rN=诊断+修复（run_pytest 失败 → 实际执行
# run_shell 确认 virtualenv 成功 → task_update 新增“确认 virtualenv”步骤），
# rN+1=验证成功（run_pytest 通过）。4 个 task 行为完全一致，证明
# “先确认 virtualenv”是稳定新增步骤，应 UPDATE 现有 debug-python。
initial_runs:
  - run_id: r1
    events:
      - {type: tool_started, tool_name: run_pytest, arguments: {}}
      - {type: tool_completed, tool_name: run_pytest, arguments: {}, success: false, error: venv}
      - {type: tool_started, tool_name: run_shell, arguments: {command: 'python -c "import sys; print(sys.prefix)"'}}
      - {type: tool_completed, tool_name: run_shell, arguments: {command: 'python -c "import sys; print(sys.prefix)"'}, success: true}
      - {type: tool_started, tool_name: task_update, arguments: {steps: [{id: s1, title: 复现错误}, {id: s2, title: 确认 virtualenv}, {id: s3, title: 修复并验证}], step_id: s2, step_status: done, step_note: 新增步骤：先确认 virtualenv}}
      - {type: tool_completed, tool_name: task_update, arguments: {steps: [{id: s1, title: 复现错误}, {id: s2, title: 确认 virtualenv}, {id: s3, title: 修复并验证}], step_id: s2, step_status: done, step_note: 新增步骤：先确认 virtualenv}}
      - {type: agent_completed}
  - run_id: r2
    events:
      - {type: tool_started, tool_name: run_pytest, arguments: {}}
      - {type: tool_completed, tool_name: run_pytest, arguments: {}, success: true}
      - {type: tool_started, tool_name: task_update, arguments: {status: completed}}
      - {type: tool_completed, tool_name: task_update, arguments: {status: completed}}
      - {type: agent_completed}
  - run_id: r3
    events:
      - {type: tool_started, tool_name: run_pytest, arguments: {}}
      - {type: tool_completed, tool_name: run_pytest, arguments: {}, success: false, error: venv missing}
      - {type: tool_started, tool_name: run_shell, arguments: {command: 'python -c "import sys; print(sys.prefix)"'}}
      - {type: tool_completed, tool_name: run_shell, arguments: {command: 'python -c "import sys; print(sys.prefix)"'}, success: true}
      - {type: tool_started, tool_name: task_update, arguments: {steps: [{id: s1, title: 复现错误}, {id: s2, title: 确认 virtualenv}, {id: s3, title: 修复并验证}], step_id: s2, step_status: done, step_note: 新增步骤：先确认 virtualenv}}
      - {type: tool_completed, tool_name: task_update, arguments: {steps: [{id: s1, title: 复现错误}, {id: s2, title: 确认 virtualenv}, {id: s3, title: 修复并验证}], step_id: s2, step_status: done, step_note: 新增步骤：先确认 virtualenv}}
      - {type: agent_completed}
  - run_id: r4
    events:
      - {type: tool_started, tool_name: run_pytest, arguments: {}}
      - {type: tool_completed, tool_name: run_pytest, arguments: {}, success: true}
      - {type: tool_started, tool_name: task_update, arguments: {status: completed}}
      - {type: tool_completed, tool_name: task_update, arguments: {status: completed}}
      - {type: agent_completed}
  - run_id: r5
    events:
      - {type: tool_started, tool_name: run_pytest, arguments: {}}
      - {type: tool_completed, tool_name: run_pytest, arguments: {}, success: false, error: path not found}
      - {type: tool_started, tool_name: run_shell, arguments: {command: 'python -c "import sys; print(sys.prefix)"'}}
      - {type: tool_completed, tool_name: run_shell, arguments: {command: 'python -c "import sys; print(sys.prefix)"'}, success: true}
      - {type: tool_started, tool_name: task_update, arguments: {steps: [{id: s1, title: 复现错误}, {id: s2, title: 确认 virtualenv}, {id: s3, title: 修复并验证}], step_id: s2, step_status: done, step_note: 新增步骤：先确认 virtualenv}}
      - {type: tool_completed, tool_name: task_update, arguments: {steps: [{id: s1, title: 复现错误}, {id: s2, title: 确认 virtualenv}, {id: s3, title: 修复并验证}], step_id: s2, step_status: done, step_note: 新增步骤：先确认 virtualenv}}
      - {type: agent_completed}
  - run_id: r6
    events:
      - {type: tool_started, tool_name: run_pytest, arguments: {}}
      - {type: tool_completed, tool_name: run_pytest, arguments: {}, success: true}
      - {type: tool_started, tool_name: task_update, arguments: {status: completed}}
      - {type: tool_completed, tool_name: task_update, arguments: {status: completed}}
      - {type: agent_completed}
  - run_id: r7
    events:
      - {type: tool_started, tool_name: run_pytest, arguments: {}}
      - {type: tool_completed, tool_name: run_pytest, arguments: {}, success: false, error: environment mismatch}
      - {type: tool_started, tool_name: run_shell, arguments: {command: 'python -c "import sys; print(sys.prefix)"'}}
      - {type: tool_completed, tool_name: run_shell, arguments: {command: 'python -c "import sys; print(sys.prefix)"'}, success: true}
      - {type: tool_started, tool_name: task_update, arguments: {steps: [{id: s1, title: 复现错误}, {id: s2, title: 确认 virtualenv}, {id: s3, title: 修复并验证}], step_id: s2, step_status: done, step_note: 新增步骤：先确认 virtualenv}}
      - {type: tool_completed, tool_name: task_update, arguments: {steps: [{id: s1, title: 复现错误}, {id: s2, title: 确认 virtualenv}, {id: s3, title: 修复并验证}], step_id: s2, step_status: done, step_note: 新增步骤：先确认 virtualenv}}
      - {type: agent_completed}
  - run_id: r8
    events:
      - {type: tool_started, tool_name: run_pytest, arguments: {}}
      - {type: tool_completed, tool_name: run_pytest, arguments: {}, success: true}
      - {type: tool_started, tool_name: task_update, arguments: {status: completed}}
      - {type: tool_completed, tool_name: task_update, arguments: {status: completed}}
      - {type: agent_completed}
expect:
  learning:
    batch_size: 4
    candidate_count: 1
    create_count: 0
    update_count: 1
    expected_action: update
    expected_names: [debug-python]
    expected_pattern_task_aliases: [v1, v2, v3, v4]
