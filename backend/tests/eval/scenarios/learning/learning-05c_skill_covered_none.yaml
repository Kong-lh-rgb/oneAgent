      - {type: tool_started, tool_name: task_update, arguments: {steps: [{id: s1, title: 复现错误}, {id: s2, title: 确认 virtualenv}, {id: s3, title: 修复并验证}], step_id: s2, step_status: done, step_note: 确认 virtualenv 是关键步骤}}
