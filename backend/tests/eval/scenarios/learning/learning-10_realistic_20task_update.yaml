id: learning-10
group: learning
name: 真实 20-Task 批次：Python 环境错配高频模式 + 噪声 + 跨 Run Trace → UPDATE debug-python
user_input: skill learning realistic batch
initial_skills:
- name: debug-python
  description: 排查 Python 报错、异常和测试失败的通用流程
  body: |
    # Debug Python

    ## Procedure
    1. 复现错误。
    2. 阅读 traceback，定位失败位置。
    3. 做最小代码修复。
    4. 重新运行失败测试。

    ## Pitfalls
    - 不要在没有 traceback 的情况下猜测根因。

    ## Verification
    - 原失败测试通过。
initial_tasks:
- alias: py1
  title: CI pytest 本地正常但线上 ModuleNotFoundError
  description: 本地 pytest 通过，CI 使用错误 Python 环境导致 requests 无法导入
  goal: 确认 CI 实际解释器与项目 virtualenv 一致并恢复测试
  status: completed
  run_ids:
  - py1-r1
  - py1-r2
  steps:
  - id: s1
    title: 复现并读取 traceback
    status: done
  - id: s2
    title: 确认实际 Python 解释器与 virtualenv
    status: done
  - id: s3
    title: 在项目环境修复依赖
    status: done
  - id: s4
    title: 定向与全量 pytest 验证
    status: done
