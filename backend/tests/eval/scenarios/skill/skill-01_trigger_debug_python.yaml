id: skill-01
group: skill
name: 触发 debug-python
initial_skills:
  - name: debug-python
    description: 排查 Python 报错或异常的标准流程
    body: |
      # Debug Python
      遇到 Python 报错时按流程排查：
      1. 复现
      2. 读 traceback
      3. 查代码
      4. 查环境
      5. 修复并验证
  - name: code-review
    description: 对代码变更做结构化代码评审
    body: |
      # Code Review
      按正确性、可维护性、测试、安全维度评审。
  - name: structured-research
    description: 对开放性问题做结构化研究
    body: |
      # Structured Research
      拆解问题、搜集信息、交叉验证、标注置信度。
user_input: >-
  我这段 Python 代码报错了：TypeError: unsupported operand type(s) for +，
  请按标准流程帮我排查这个报错。
max_steps: 6
expect:
  skill:
    activated: [debug-python]
    not_activated: [code-review, structured-research]
  tools:
    must: [skill_read]
    successful: [skill_read]
  answer:
    keypoints: ["traceback"]
