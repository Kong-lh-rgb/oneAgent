id: skill-09
group: skill
name: 读取文件不触发 skill
initial_skills:
  - name: debug-python
    description: 排查 Python 报错或异常的标准流程
    body: |
      # Debug Python
      复现、读 traceback、查代码。
  - name: code-review
    description: 对代码变更做结构化代码评审
    body: |
      # Code Review
      按正确性、可维护性、测试、安全维度评审。
user_input: "请读取 workspace 中 notes/hello.txt 的内容并原样告诉我。"
initial_files:
  - path: notes/hello.txt
    content: "你好，Vesta。"
max_steps: 5
expect:
  skill:
    activated: []
    not_activated: [debug-python, code-review]
  tools:
    must: [read_file]
    successful: [read_file]
    must_not: [skill_read]
  task:
    created: false
