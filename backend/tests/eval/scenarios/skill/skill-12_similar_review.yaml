id: skill-12
group: skill
name: 相似场景 - 评审代码激活 code-review 而非 debug-python
initial_skills:
  - name: debug-python
    description: 排查 Python 报错或异常的标准流程
    body: |
      # Debug Python
      遇到 bug 或报错时：1. 复现 2. 读 traceback 3. 查代码 4. 修复并验证。
  - name: code-review
    description: 对代码变更做结构化代码评审
    body: |
      # Code Review
      按正确性、可维护性、测试、安全维度评审，用 P0/P1/P2 标注。
user_input: >-
  这段函数可能有边界问题，请帮我 review 一下它的实现是否健壮，
  并给出需要改进的地方。
max_steps: 6
expect:
  skill:
    activated: [code-review]
    not_activated: [debug-python]
  tools:
    must: [skill_read]
  answer:
    keypoints: ["P0", "P1", "P2"]
